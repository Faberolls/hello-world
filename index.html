<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BayamSell Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>BayamSell</h1>
      <p>Marketplace + Seller Admin + Super Admin</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="marketplace">Marketplace</button>
      <button class="tab" data-tab="seller">Seller Admin</button>
      <button class="tab" data-tab="owner">Super Admin</button>
    </nav>

    <main>
      <section id="marketplace" class="panel active">
        <h2>Marketplace</h2>
        <div id="productGrid" class="grid"></div>
      </section>

      <section id="seller" class="panel">
        <h2>Seller Admin</h2>
        <form id="productForm" class="card">
          <h3>Add Product</h3>
          <label>Product Name <input required name="name" /></label>
          <label>Price (USD) <input required type="number" min="0" step="0.01" name="price" /></label>
          <label>Stock <input required type="number" min="0" step="1" name="stock" /></label>
          <label>Category <input required name="category" /></label>
          <button type="submit">Create Product</button>
        </form>

        <div class="card">
          <h3>Your Products</h3>
          <table>
            <thead>
              <tr><th>Name</th><th>Price</th><th>Stock</th><th>Category</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="sellerProductRows"></tbody>
          </table>
        </div>
      </section>

      <section id="owner" class="panel">
        <h2>Super Admin (App Owner)</h2>
        <div class="stats">
          <article class="card"><h3>Total Products</h3><p id="statProducts">0</p></article>
          <article class="card"><h3>Active Listings</h3><p id="statActive">0</p></article>
          <article class="card"><h3>Total Inventory</h3><p id="statStock">0</p></article>
        </div>
        <div class="card">
          <h3>Product Moderation</h3>
          <table>
            <thead>
              <tr><th>Name</th><th>Seller</th><th>Price</th><th>Status</th><th>Moderation</th></tr>
            </thead>
            <tbody id="ownerRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
